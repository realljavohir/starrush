<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F6FB" id="metaTheme">
<title>StarRush</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FB;--s1:#fff;--s2:#F8F9FD;--s3:#EEF1F8;--tx:#0B1020;--tx2:#434B61;--mu:#7C859B;--ln:#E6EAF2;
--ac:#F5B335;--ac2:#FFD36E;--aci:#3B2500;--vi:#6C5CE7;--vi2:#8E80FF;--vis:#EEEAFF;--mi:#0FB58C;--mis:#DDF6EE;
--ro:#E84393;--ros:#FDEAF3;--dg:#D63031;--dgs:#FDEAEA;--glass:rgba(255,255,255,.72);
--sh:0 2px 10px -2px rgba(11,16,32,.08);--shl:0 30px 70px -20px rgba(11,16,32,.38);
--out:cubic-bezier(.16,1,.3,1);--sp:cubic-bezier(.34,1.56,.64,1)}
[data-theme=dark]{--bg:#06080E;--s1:#0E121B;--s2:#131824;--s3:#1A2030;--tx:#F4F6FB;--tx2:#B6BDCE;--mu:#7B8498;--ln:#1D2331;
--vis:#1C1838;--mis:#0C2620;--ros:#2A1521;--dgs:#2A1416;--glass:rgba(14,18,27,.72)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx)}
body{font:15px/1.5 'Inter',-apple-system,sans-serif;letter-spacing:-.011em;min-height:100vh;overflow-x:hidden;
padding:max(14px,env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
input{font:inherit;color:inherit;background:none;border:0;outline:0;width:100%}
svg{display:block;flex-shrink:0}
:focus-visible{outline:2px solid var(--vi);outline-offset:3px;border-radius:8px}
/* aurora */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(70px);opacity:.38;animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--vi);top:-140px;right:-120px}
.aurora i:nth-child(2){background:var(--ac);top:30%;left:-180px;animation-delay:-6s;animation-duration:22s}
.aurora i:nth-child(3){background:var(--ro);bottom:-180px;right:-100px;opacity:.22;animation-delay:-11s}
[data-theme=dark] .aurora i{opacity:.2}
@keyframes drift{to{transform:translate(60px,50px) scale(1.18)}}
.wrap{max-width:440px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;padding:4px 0 18px;animation:up .6s var(--out) both}
.avatar{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--vi),var(--vi2));color:#fff;display:grid;
place-items:center;font-weight:800;font-size:18px;box-shadow:0 10px 22px -8px rgba(108,92,231,.65);position:relative;overflow:hidden}
.avatar::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);
transform:translateX(-120%);animation:glint 4s 1s infinite}
@keyframes glint{40%,100%{transform:translateX(120%)}}
.who{flex:1;min-width:0}.name{font-size:16.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handle{font-size:12.5px;color:var(--mu);font-weight:500}
.ha{display:flex;gap:8px}
.ib{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--ln);
backdrop-filter:blur(12px);color:var(--tx2);position:relative;overflow:hidden;transition:transform .2s var(--sp)}
.ib:active{transform:scale(.88)}.ib svg{width:19px;height:19px}
.ib .ic{position:absolute;inset:0;display:grid;place-items:center;transition:transform .5s var(--sp),opacity .3s}
.ib .sun{opacity:0;transform:rotate(-120deg) scale(.4)}
[data-theme=dark] .ib .sun{opacity:1;transform:none}[data-theme=dark] .ib .moon{opacity:0;transform:rotate(120deg) scale(.4)}
.spin svg{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
/* entrance */
.in{animation:up .6s var(--out) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
#content.swap{animation:swap .4s var(--out)}@keyframes swap{from{opacity:.0;transform:translateX(14px)}to{opacity:1;transform:none}}
/* balance */
.tilt{transform-style:preserve-3d;transition:transform .25s var(--out);will-change:transform}
.bal{position:relative;isolation:isolate;overflow:hidden;border-radius:30px;padding:26px 22px 22px;color:#fff;
background:linear-gradient(155deg,#0B1020,#1A2142 55%,#0F1530);box-shadow:var(--shl);border:1px solid rgba(255,255,255,.1)}
.bal::before{content:'';position:absolute;top:-100px;right:-80px;width:300px;height:300px;background:radial-gradient(circle,rgba(245,179,53,.4),transparent 66%);z-index:-1;animation:pulse 5s ease-in-out infinite}
.bal::after{content:'';position:absolute;bottom:-110px;left:-70px;width:260px;height:260px;background:radial-gradient(circle,rgba(108,92,231,.4),transparent 66%);z-index:-1;animation:pulse 6s 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.2);opacity:.7}}
.sparks{position:absolute;inset:0;z-index:-1;overflow:hidden}
.sparks i{position:absolute;bottom:-12px;width:5px;height:5px;background:var(--ac2);border-radius:50%;opacity:0;animation:rise 6s linear infinite}
@keyframes rise{10%{opacity:.9}100%{transform:translateY(-300px) scale(.3);opacity:0}}
.bt{display:flex;justify-content:space-between;align-items:center}
.bl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.br{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);font-size:12px;font-weight:700}
.br svg{width:12px;height:12px;color:var(--ac2)}
.bv{display:flex;align-items:center;gap:12px;margin:12px 0 22px;font-size:58px;font-weight:800;letter-spacing:-.045em;line-height:1}
#bal{background:linear-gradient(180deg,#fff,#c3cbe8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bv .star{width:38px;height:38px;color:var(--ac);filter:drop-shadow(0 6px 16px rgba(245,179,53,.7));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(14deg) scale(1.08)}}
.bk{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:10px}.bk .r{color:rgba(255,255,255,.6);font-size:12.5px}
.tr{height:8px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
.fl{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 0 18px rgba(245,179,53,.7);transition:width 1.4s var(--out);position:relative;overflow:hidden}
.fl::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shim 2.2s infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.nx{font-size:12.5px;color:rgba(255,255,255,.64);margin-top:10px}.nx b{color:var(--ac2)}
/* buttons */
.btns{display:flex;gap:10px;margin-top:14px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:54px;border-radius:15px;font-weight:700;font-size:15px;transition:transform .2s var(--sp),filter .2s}
.btn:active{transform:scale(.96)}.btn svg{width:19px;height:19px}
.bp{flex:1;color:#fff;background:linear-gradient(155deg,var(--vi),#4B3FC4);box-shadow:0 14px 30px -10px rgba(108,92,231,.65)}
.bs{width:54px;background:var(--s1);border:1px solid var(--ln)}
.bb{width:100%;margin-top:14px}
.bg{background:linear-gradient(155deg,var(--ac),var(--ac2));color:var(--aci);box-shadow:0 14px 30px -10px rgba(245,179,53,.7)}
.br2{background:linear-gradient(155deg,var(--ro),#FF71B8);color:#fff;box-shadow:0 14px 30px -10px rgba(232,67,147,.55)}
.btn:disabled{opacity:.55;pointer-events:none}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s var(--out);pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:18px;padding:15px 16px;box-shadow:var(--sh);transition:transform .25s var(--sp)}
.stat:active{transform:scale(.96)}
.si{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px}.si svg{width:16px;height:16px}
.si.v{background:var(--vis);color:var(--vi)}.si.m{background:var(--mis);color:var(--mi)}.si.r{background:var(--ros);color:var(--ro)}.si.g{background:rgba(245,179,53,.18);color:#B47800}
.sl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}
.sv{display:flex;align-items:baseline;gap:4px;margin-top:5px;font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1}.sv small{font-size:13px;color:var(--mu)}
.h2{display:flex;align-items:center;gap:8px;margin:26px 4px 12px;font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mu)}
.h2 svg{width:16px;height:16px}.h2c{margin-left:auto;font-size:11.5px;letter-spacing:0;text-transform:none;background:var(--s1);border:1px solid var(--ln);padding:3px 10px;border-radius:99px;color:var(--tx2)}
.list{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:24px;overflow:hidden;box-shadow:var(--sh)}
.row,.lb,.task,.lv,.ad{display:flex;align-items:center;gap:13px;padding:13px 16px;transition:background .15s}
.row+.row,.lb+.lb,.task+.task,.lv+.lv,.ad+.ad{border-top:1px solid var(--ln)}
.lb:active,.task:active,.lv:active{background:var(--s3)}
.rt{font-size:14.5px;font-weight:600}.rs{font-size:12.5px;color:var(--mu);font-weight:500;margin-top:2px}.rb{flex:1;min-width:0}
.iw{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s3);font-size:19px;flex-shrink:0}.iw svg{width:19px;height:19px}
.iw.mint{background:var(--mis);color:var(--mi)}.iw.gold{background:rgba(245,179,53,.18);color:#B47800}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}.chip svg{width:12px;height:12px}
.cm{background:var(--s3);color:var(--tx2)}.cg{background:var(--mis);color:var(--mi)}.cy{background:linear-gradient(155deg,var(--ac),var(--ac2));color:var(--aci)}
.li{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--s3);flex-shrink:0}
.li.now{background:linear-gradient(155deg,var(--ac),var(--ac2));box-shadow:0 8px 20px -6px rgba(245,179,53,.7);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 8px 28px -2px rgba(245,179,53,.95)}}
.li.done{background:var(--mis)}.lv.locked{opacity:.5}
.lb.me{background:var(--vis)}.lr{width:28px;text-align:center;font-size:15px;font-weight:800;color:var(--mu)}.lr.t{font-size:20px}
.la{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#0B1020,#1B2240);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.ln{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.you{font-size:9.5px;font-weight:800;background:var(--vi);color:#fff;padding:2px 6px;border-radius:5px;text-transform:uppercase}
.lsub{font-size:12px;color:var(--mu);font-weight:500}.lval{font-size:15px;font-weight:800;white-space:nowrap}.lval small{font-size:11px;color:var(--mu);margin-left:2px}
.dots{padding:6px;text-align:center;color:var(--mu);letter-spacing:5px;border-top:1px solid var(--ln)}
.seg{display:flex;gap:3px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:15px;padding:4px;margin-top:14px;position:relative}
.seg button{flex:1;height:38px;border-radius:11px;font-size:13px;font-weight:600;color:var(--mu);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .3s var(--out)}
.seg button svg{width:14px;height:14px}
.seg button.on{background:linear-gradient(155deg,var(--vi),#4B3FC4);color:#fff;font-weight:700;box-shadow:0 8px 18px -6px rgba(108,92,231,.6)}
/* hero */
.hero{position:relative;isolation:isolate;overflow:hidden;color:#fff;border-radius:30px;padding:24px 22px;background:linear-gradient(155deg,#0B1020,#1D2347 55%,#0F1530);box-shadow:var(--shl);border:1px solid rgba(255,255,255,.1)}
.hero::before{content:'';position:absolute;top:-120px;right:-90px;width:320px;height:320px;background:radial-gradient(circle,rgba(245,179,53,.34),transparent 65%);z-index:-1;animation:pulse 5s infinite}
.hero::after{content:'';position:absolute;bottom:-140px;left:-80px;width:280px;height:280px;background:radial-gradient(circle,rgba(232,67,147,.26),transparent 65%);z-index:-1;animation:pulse 7s 1s infinite}
.hb{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:rgba(245,179,53,.16);border:1px solid rgba(245,179,53,.28);color:var(--ac2);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}.hb svg{width:12px;height:12px}
.ht{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin:14px 0 8px}.hd{font-size:13.5px;color:rgba(255,255,255,.72);margin-bottom:18px}
.hr{display:flex;align-items:center;gap:14px;padding:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:18px}
.he{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(245,179,53,.18);animation:bob 3s ease-in-out infinite}
.hl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.55)}.hv{font-size:17px;font-weight:700;margin-top:2px}
.tm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.tb{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:11px 4px;text-align:center}
.tn{font-size:22px;font-weight:800;line-height:1}.tl{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:5px}
.hbtn{position:relative;overflow:hidden;width:100%;height:52px;margin-top:16px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;color:var(--aci);background:linear-gradient(155deg,var(--ac),var(--ac2));box-shadow:0 14px 30px -10px rgba(245,179,53,.65);transition:transform .2s var(--sp)}
.hbtn:active{transform:scale(.96)}.hbtn svg{width:18px;height:18px}
.hbtn:not(.off)::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:glint 3s infinite}
.hbtn.off{background:rgba(255,255,255,.08);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.14);box-shadow:none;pointer-events:none}
.stk{display:flex;gap:6px;margin:0 0 18px}
.sd{flex:1;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.07);color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.1)}
.sd.done,.sd.cur{background:linear-gradient(155deg,var(--ac),var(--ac2));color:var(--aci);border-color:transparent}
.sd.cur{animation:ring 2s infinite}@keyframes ring{0%{box-shadow:0 0 0 0 rgba(245,179,53,.6)}70%,100%{box-shadow:0 0 0 11px rgba(245,179,53,0)}}
.task.done{background:var(--s2)}
.ti{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--s3);flex-shrink:0}.task.done .ti{background:var(--mis)}
.tt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trw{font-size:12px;font-weight:600;color:var(--mu);margin-top:2px;display:flex;align-items:center;gap:5px}.trw svg{color:var(--ac)}
.tbn{position:relative;overflow:hidden;height:36px;padding:0 14px;border-radius:11px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;background:var(--s3);color:var(--tx2);transition:transform .2s var(--sp)}
.tbn:active{transform:scale(.92)}.tbn svg{width:13px;height:13px}
.tbn.claim{background:linear-gradient(155deg,var(--ac),var(--ac2));color:var(--aci);animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,80%,100%{transform:none}86%{transform:rotate(-5deg)}92%{transform:rotate(5deg)}}
.tbn.claimed{background:var(--mis);color:var(--mi)}.tbn.dn{background:var(--vis);color:var(--vi)}
.promo{display:flex;gap:10px;margin-top:12px}
.promo input{flex:1;height:52px;border-radius:15px;background:var(--s2);border:1.5px solid var(--ln);padding:0 16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:all .25s}
.promo input::placeholder{color:var(--mu);font-weight:500;letter-spacing:.02em;text-transform:none}
.promo input:focus{border-color:var(--ac);background:var(--s1);box-shadow:0 0 0 4px rgba(245,179,53,.18)}
.pb{position:relative;overflow:hidden;height:52px;padding:0 22px;border-radius:15px;background:linear-gradient(155deg,var(--ac),var(--ac2));color:var(--aci);font-weight:800;box-shadow:0 12px 26px -10px rgba(245,179,53,.7);transition:transform .2s var(--sp)}.pb:active{transform:scale(.94)}
.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ad{flex-direction:column;align-items:stretch;gap:10px}.ah{display:flex;align-items:center;gap:13px}.am{display:flex;gap:8px;flex-wrap:wrap}
.empty{background:var(--glass);border:1px solid var(--ln);border-radius:24px;padding:38px 22px;text-align:center}
.ei{width:64px;height:64px;border-radius:20px;background:var(--s3);color:var(--mu);display:grid;place-items:center;margin:0 auto 16px;animation:bob 3.5s infinite}.ei svg{width:30px;height:30px}
.et{font-size:15.5px;font-weight:700;margin-bottom:6px}.ed{font-size:13.5px;color:var(--mu);max-width:280px;margin:0 auto}
.err{background:var(--dgs);border:1px solid rgba(214,48,49,.25);border-radius:24px;padding:22px}.err b{display:block;color:var(--dg);margin-bottom:6px}.err p{font-size:13.5px;color:var(--tx2);margin-bottom:14px}
.err button{height:42px;padding:0 20px;border-radius:12px;background:var(--dg);color:#fff;font-weight:700}
.sk{border-radius:24px;background:linear-gradient(90deg,var(--s3) 25%,var(--ln) 50%,var(--s3) 75%);background-size:200% 100%;animation:sk 1.4s infinite}@keyframes sk{to{background-position:-200% 0}}
/* nav */
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;border:1px solid var(--ln);border-radius:26px;padding:6px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 20px 44px -16px rgba(11,16,32,.45)}
.ni{max-width:420px;margin:0 auto;display:flex;position:relative}
.pill{position:absolute;top:0;bottom:0;left:0;border-radius:20px;background:var(--vis);transition:transform .5s var(--sp),width .5s var(--sp)}
.tab{position:relative;z-index:1;flex:1;min-width:0;height:54px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu);font-size:10.5px;font-weight:700;transition:color .3s}
.tab svg{width:21px;height:21px;transition:transform .45s var(--sp)}.tab[aria-current=page]{color:var(--vi)}.tab[aria-current=page] svg{transform:translateY(-2px) scale(1.15)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,24px) scale(.9);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:all .4s var(--sp);z-index:100;box-shadow:var(--shl);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px)}
.toast svg{width:18px;height:18px}.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}.toast.ok{background:var(--mi);color:#fff}.toast.err{background:var(--dg);color:#fff}

clock:S('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),heart:S('<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8Z"/>'),

ticket:S('<path d="M2 9a3 3 0 0 1 0 6v3a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-3a3 3 0 0 1 0-6V6a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1Z"/><path d="M13 5v2M13 17v2M13 11v2"/>'),

const D={profile:{user_id:1,first_name:'Demo',username:'demo',stars:1250,level_name:'Bronza',level_emoji:'🥉',level_min:500,level_max:2000,referrals:12,week_referrals:3,donated:50,rank:45},

async function api(p,o={},tries=3){
  if(DEMO){await sleep(300);return D[p.replace('/api/','')]||{}}
  let le;
  for(let i=0;i<tries;i++){
    try{
      const r=await fetch(API+p,{...o,headers:{'X-Telegram-Init-Data':tg.initData,Accept:'application/json',...(o.headers||{})}});
      let d=null;try{d=await r.json()}catch(e){}
      if(!r.ok){const e=new Error((d&&d.error)||`Server xatosi (${r.status})`);e.status=r.status;throw e}
      if(!d)throw new Error("Bo'sh javob");if(d.error)throw new Error(d.error);return d;
    }catch(e){le=e.status?e:new Error("Internet aloqasini tekshiring.");if(e.status&&e.status<500)break;if(o.method==='POST')break;if(i<tries-1)await sleep(800*(i+1))}
  }throw le;
}
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});

let tt;function toast(m,t=''){const e=$('toast');e.innerHTML=(t==='ok'?sz(I.check,18):t==='err'?sz(I.x,18):'')+`<span>${esc(m)}</span>`;e.className='toast on '+t;clearTimeout(tt);tt=setTimeout(()=>e.className='toast '+t,2600)}
function confetti(){const c=$('cf'),col=['#F5B335','#FFD36E','#6C5CE7','#0FB58C','#E84393','#0984E3'];
  for(let i=0;i<60;i++){const p=document.createElement('i');p.style.cssText=`left:${Math.random()*100}%;background:${col[i%6]};--dx:${(Math.random()-.5)*160}px;animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.3}s`;c.appendChild(p);setTimeout(()=>p.remove(),3600)}}
function countUp(el,to){if(matchMedia('(prefers-reduced-motion: reduce)').matches||to<2){el.textContent=fmt(to);return}
  const t0=performance.now();const f=n=>{const p=Math.min(1,(n-t0)/1100);el.textContent=fmt(Math.round(to*(1-Math.pow(1-p,4))));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}

function home({profile:d,levels:lv}){
  head(d);const s=Number(d.stars)||0,max=Number(d.level_max)>=MAXL,span=d.level_max-d.level_min;
  const pct=max?100:span>0?Math.max(0,Math.min(100,(s-d.level_min)/span*100)):100,left=Math.max(0,d.level_max+1-s);
  st.ref=`https://t.me/${BOT}?start=ref_${d.user_id}`;
  const lr=(lv.levels||[]).map(l=>{const lm=Number(l.max)>=MAXL,k=s>l.max?'done':s>=l.min?'now':'locked';
    const b=k==='now'?'<span class="chip cy">Siz shu yerda</span>':k==='done'?`<span class="chip cg">${sz(I.check,12)} O'tildi</span>`:`<span class="chip cm">${sz(I.lock,12)} Yopiq</span>`;
    return `<div class="lv ${k==='locked'?'locked':''}"><div class="li ${k}">${esc(l.emoji)}</div><div class="rb"><div class="rt">${esc(l.name)}</div><div class="rs">${lm?fmt(l.min)+'+':fmt(l.min)+' – '+fmt(l.max)} ⭐</div></div>${b}</div>`}).join('');
  const sp=Array.from({length:9},(_,i)=>`<i style="left:${8+i*10}%;animation-delay:${i*.7}s;animation-duration:${4.5+i%3}s"></i>`).join('');
  return `<section class="bal tilt" id="tilt"><div class="sparks">${sp}</div>
    <div class="bt"><span class="bl">Balans</span><span class="br">${I.rank} #${fmt(d.rank)}</span></div>
    <div class="bv"><span id="bal">0</span><span class="star">${sz(I.star,38)}</span></div>
    <div class="bk"><span>${esc(d.level_emoji)} ${esc(d.level_name)}</span><span class="r">${max?'':fmt(s)+' / '+fmt(d.level_max)}</span></div>
    <div class="tr"><div class="fl" id="fill" data-w="${pct}"></div></div>
    <div class="nx">${max?'👑 Siz eng yuqori darajadasiz':`Keyingi darajaga <b>${fmt(left)}</b> stars qoldi`}</div></section>
    ${share()}
    <div class="stats">
      <div class="stat"><div class="si v">${I.users}</div><div class="sl">Do'stlar</div><div class="sv">${fmt(d.referrals)}</div></div>
      <div class="stat"><div class="si m">${I.spark}</div><div class="sl">Bu hafta</div><div class="sv">+${fmt(d.week_referrals)}</div></div>
      <div class="stat"><div class="si r">${I.heart}</div><div class="sl">Donat</div><div class="sv">${fmt(d.donated)}<small>⭐</small></div></div>
      <div class="stat"><div class="si g">${I.rank}</div><div class="sl">O'rin</div><div class="sv">#${fmt(d.rank)}</div></div></div>
    ${h2(I.level,"Darajalar yo'li")}<section class="list">${lr}</section>

function contest(d){
  const seg=`<div class="seg"><button data-ct="active" class="${st.ct==='active'?'on':''}">${sz(I.flame,14)} Faol</button><button data-ct="finished" class="${st.ct==='finished'?'on':''}">${sz(I.check,14)} Tugagan</button></div>`;
  const a=d.active,fin=d.finished||[];
  if(st.ct==='active'&&a){
    const end=new Date(a.end_at).getTime(),pr=ms=>[Math.floor(ms/864e5),Math.floor(ms%864e5/36e5),Math.floor(ms%36e5/6e4),Math.floor(ms%6e4/1e3)];
    const [dd,hh,mm,ss]=pr(Math.max(0,end-Date.now())),ls=a.leaders||[];
    const rows=ls.map((x,i)=>`<div class="lb ${x.is_me?'me':''}"><div class="lr ${i<3?'t':''}">${['🥇','🥈','🥉'][i]||i+1}</div><div class="la">${ini(x.name)}</div><div class="rb"><div class="ln">${esc(x.name)}${x.is_me?'<span class="you">siz</span>':''}</div><div class="lsub">${fmt(x.count)} ta referal</div></div></div>`).join('')||`<div class="lb"><div class="lsub">Hozircha qatnashuvchilar yo'q</div></div>`;
    const me=a.me,mr=me&&!ls.some(x=>x.is_me)?`<div class="dots">· · ·</div><div class="lb me"><div class="lr">${fmt(me.rank)}</div><div class="la">${ini(me.name)}</div><div class="rb"><div class="ln">${esc(me.name)}<span class="you">siz</span></div><div class="lsub">${fmt(me.count)} ta referal</div></div></div>`:'';
    clearInterval(window.__ct);window.__ct=setInterval(()=>{const b=document.querySelectorAll('.tn');if(b.length!==4)return clearInterval(window.__ct);pr(Math.max(0,end-Date.now())).forEach((v,i)=>b[i].textContent=v)},1000);
    return seg+`<div class="hero" style="margin-top:14px"><span class="hb">${sz(I.bolt,12)} Sovrinli konkurs</span><div class="ht">${esc(a.title)}</div><div class="hd">${esc(a.description)}</div>
      <div class="hr"><div class="he">${esc(a.reward_emoji||'🎁')}</div><div><div class="hl">Sovrin</div><div class="hv">${esc(a.reward_name||'Gift')}</div></div></div>
      <div class="tm">${[[dd,'Kun'],[hh,'Soat'],[mm,'Daqiqa'],[ss,'Soniya']].map(([v,l])=>`<div class="tb"><div class="tn">${v}</div><div class="tl">${l}</div></div>`).join('')}</div></div>
      ${h2(I.rank,'Leaderboard')}<section class="list">${rows}${mr}</section>
      <button class="btn bb bg" data-act="share">${sz(I.send,18)}<span>Do'stlarni taklif qilish</span></button>`;
  }
  if(st.ct==='finished')return seg+(fin.length?fin.map(c=>`<div class="list" style="margin-top:12px"><div class="row"><div class="iw mint">${I.check}</div><div class="rb"><div class="rt">${esc(c.title)}</div><div class="rs">Sovrin: ${esc(c.reward_emoji||'🎁')} ${esc(c.reward_name||'Gift')}</div></div><span class="chip cm">Tugagan</span></div><div class="row"><div class="iw">🏆</div><div class="rb"><div class="rt">G'olib: ${esc(c.winner_name||'—')}</div><div class="rs">${fmt(c.winner_referrals)} ta referal</div></div></div></div>`).join(''):`<div class="empty" style="margin-top:14px"><div class="ei">${I.crown}</div><div class="et">Tugagan konkurslar yo'q</div></div>`);
  return seg+`<div class="empty" style="margin-top:14px"><div class="ei">${I.crown}</div><div class="et">Faol konkurs yo'q</div><div class="ed">Yangi konkurs tez orada!</div></div>`;
}

function bonus(d){
  const dl=d.daily||{},can=!!dl.can_claim,sk=dl.streak||0,rw=dl.reward||0,nx=dl.next_reward||rw;
  const dots=Array.from({length:7},(_,i)=>{const dn=i<sk,cu=i===sk&&can;return `<div class="sd ${dn?'done':cu?'cur':''}">${dn?'✓':i+1}</div>`}).join('');
  const tl=d.tasks||[];
  const tasks=tl.map(t=>{const b=t.claimed?`<button class="tbn claimed">${sz(I.check,13)} Olindi</button>`:t.claimable?`<button class="tbn claim" data-claim="${t.id}">+${fmt(t.reward)} ⭐</button>`:t.done?'<button class="tbn dn">Bajarildi</button>':`<button class="tbn" data-go="${t.id}">Bajarish</button>`;

  return `<div class="hero"><span class="hb">${sz(I.flame,12)} Kunlik bonus</span><div class="ht">${can?'Bugungi bonusingiz tayyor!':'Ertaga yana keling!'}</div>
    <div class="hd">${sk>=7?"7 kunlik seriya! Zo'r 🔥":`Ketma-ket <b>${sk} kun</b> — seriya davom etsa, mukofot oshadi.`}</div><div class="stk">${dots}</div>

    ${can?`<button class="hbtn" data-claim="daily">${sz(I.gift,18)} Bonusni olish</button>`:`<button class="hbtn off">${sz(I.clock,18)} Ertaga qaytib keling</button>`}</div>
    ${h2(I.target,'Vazifalar',`<span class="h2c">${tl.filter(t=>t.claimable).length} ta tayyor</span>`)}<section class="list">${tasks}</section>
    ${h2(I.ticket,'Promokod')}<div class="list" style="padding:18px"><div class="rs" style="font-size:13.5px">Promokodni kiriting va Stars oling.</div>
    <div class="promo"><input id="promoInput" placeholder="PROMOKOD" maxlength="32" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="pb" data-act="promo">Qo'llash</button></div></div>`;
}

function rating(d){
  const md=r=>r===1?'🥇':r===2?'🥈':r===3?'🥉':r,tabs=[['stars',I.star,'Stars'],['donate',I.heart,'Donat'],['ref',I.users,'Referal']];
  const seg=`<div class="seg">${tabs.map(([k,ic,l])=>`<button data-rt="${k}" class="${st.rt===k?'on':''}">${sz(ic,14)} ${l}</button>`).join('')}</div>`;
  const S2=d.stars||{top:[],me:{}},Dn=d.donate||{top:[]},Rf=d.ref||{top:[]};
  const row=(x,sub,v,u)=>`<div class="lb ${x.is_me?'me':''}"><div class="lr ${x.rank<=3?'t':''}">${md(x.rank)}</div><div class="la">${ini(x.name)}</div><div class="rb"><div class="ln">${esc(x.name)}${x.is_me?'<span class="you">siz</span>':''}</div>${sub?`<div class="lsub">${sub}</div>`:''}</div><div class="lval">${fmt(v)}<small>${u}</small></div></div>`;
  const em=t=>`<div class="lb"><div class="lsub">${t}</div></div>`;let b;
  if(st.rt==='stars'){const r=(S2.top||[]).map(x=>row(x,'',x.stars,'⭐')).join('');const m=(S2.top||[]).some(x=>x.is_me)||!S2.me?.rank?'':`<div class="dots">· · ·</div>`+row({...S2.me,is_me:true},'',S2.me.stars,'⭐');b=(r||em("Reyting bo'sh"))+m}
  else if(st.rt==='donate')b=(Dn.top||[]).map(x=>row(x,`${fmt(x.count)} ta donat`,x.total,'⭐')).join('')||em("Hozircha donat yo'q");
  else b=(Rf.top||[]).map(x=>row(x,'',x.count,'ta')).join('')||em("Hozircha referal yo'q");
  return `<div class="stats" style="margin-top:0"><div class="stat"><div class="si g">${I.rank}</div><div class="sl">O'rningiz</div><div class="sv">#${fmt(S2.me?.rank)}</div></div><div class="stat"><div class="si v">${I.star}</div><div class="sl">Stars</div><div class="sv">${fmt(S2.me?.stars)}</div></div></div>${seg}${h2(I.rank,'TOP 10')}<section class="list">${b}</section>`;
}
function friends(d){const it=d.items||[];
  const rows=it.map(x=>`<div class="lb"><div class="la">${ini(x.name)}</div><div class="rb"><div class="ln">${esc(x.name)}</div><div class="lsub">${fdate(x.joined_at)}</div></div><span class="chip cg">+${fmt(d.reward)} ⭐</span></div>`).join('');
  return `<div class="stats" style="margin-top:0"><div class="stat"><div class="si v">${I.users}</div><div class="sl">Jami do'stlar</div><div class="sv">${fmt(d.total)}</div></div><div class="stat"><div class="si m">${I.spark}</div><div class="sl">Bu hafta</div><div class="sv">+${fmt(d.week)}</div></div></div>${share()}${h2(I.users,'Taklif qilganlar')}
  ${it.length?`<section class="list">${rows}</section>`:`<div class="empty"><div class="ei">${I.users}</div><div class="et">Hali do'st taklif qilmagansiz</div><div class="ed">Havolani ulashing — har bir do'st uchun ${fmt(d.reward)} ⭐ olasiz.</div></div>`}`}
function advertise(d){const s=d.services||[];
  if(!s.length)return `<div class="empty"><div class="ei">${I.mega}</div><div class="et">Reklama tariflari yo'q</div><div class="ed">Tez orada qo'shiladi.</div></div>`;
  const rows=s.map(x=>`<div class="ad"><div class="ah"><div class="iw gold" style="font-size:22px">📢</div><div class="rb"><div class="rt">${esc(x.title)}</div><div class="rs">${esc(x.description)}</div></div></div>
    <div class="am">${x.hours?`<span class="chip cm">${sz(I.clock,12)} ${x.hours} soat</span>`:''}${x.bonus_subs?`<span class="chip cg">${sz(I.users,12)} +${x.bonus_subs} garant</span>`:''}</div>
    <button class="btn bg" style="height:46px" data-adbuy="${x.id}">${sz(I.star,16)} ${fmt(x.price_uzs)} so'm</button></div>`).join('');
  return `<div class="hero"><span class="hb">${sz(I.mega,12)} Reklama xizmati</span><div class="ht">Kanal/guruhingizni reklama qiling</div><div class="hd" style="margin:0">Tarifni tanlang — admin siz bilan bog'lanadi.</div></div>${h2(I.target,'Tariflar')}<section class="list">${rows}</section>`}

const LOAD={home:async()=>{const[profile,levels]=await Promise.all([api('/api/profile'),api('/api/levels')]);return{profile,levels}},contest:()=>api('/api/contest'),bonus:()=>api('/api/bonus'),rating:()=>api('/api/rating'),friends:()=>api('/api/referrals'),advertise:()=>api('/api/advertise')};
const VIEW={home,contest,bonus,rating,friends,advertise};

function render(id,swap=true){
  clearInterval(window.__ct);const c=$('content');c.innerHTML=VIEW[id](st.cache[id]);
  if(swap){c.classList.remove('swap');void c.offsetWidth;c.classList.add('swap')}
  c.querySelectorAll('.bal,.hero,.stat,.h2,.list,.btns,.seg,.empty,.btn.bb').forEach((e,i)=>{e.style.setProperty('--i',Math.min(i,12));e.classList.add('in')});
  if(id==='home')after_home(st.cache.home);
}
function skel(){$('content').innerHTML='<div class="sk" style="height:200px;border-radius:30px"></div><div class="sk" style="height:56px;margin-top:14px"></div><div class="sk" style="height:180px;margin-top:14px"></div>'}
function movePill(){const t=document.querySelector('.tab[aria-current=page]'),p=$('pill');if(!t||!p)return;p.style.width=t.offsetWidth+'px';p.style.transform=`translateX(${t.offsetLeft}px)`}

async function openTab(id,force=false){
  if(st.busy)return;st.cur=id;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===id?'page':'false'));movePill();
  if(st.cache[id]&&!force){render(id);return}
  st.busy=true;$('refresh').classList.add('spin');if(!st.cache[id])skel();
  try{st.cache[id]=await LOAD[id]();if(st.cur===id)render(id,!force)}
  catch(e){console.error(e);if(st.cache[id]){render(id,false);toast(e.message,'err')}else if(st.cur===id)$('content').innerHTML=`<div class="err in"><b>Xatolik yuz berdi</b><p>${esc(e.message)}</p><button data-act="retry">Qayta urinish</button></div>`}
  finally{st.busy=false;$('refresh').classList.remove('spin')}
}
async function copyLink(){if(!st.ref){toast("Avval «Asosiy» bo'limini oching",'err');return}
  try{await navigator.clipboard.writeText(st.ref)}catch(e){const t=document.createElement('textarea');t.value=st.ref;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(_){}t.remove()}
  toast('Havola nusxalandi','ok');okH()}
const openTg=u=>tg?tg.openTelegramLink(u):window.open(u,'_blank');
const inval=()=>{st.cache.bonus=st.cache.home=st.cache.rating=null};
function ripple(e,el){const r=el.getBoundingClientRect(),s=Math.max(r.width,r.height),i=document.createElement('span');i.className='rip';i.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;el.appendChild(i);setTimeout(()=>i.remove(),650)}

document.addEventListener('click',async e=>{
  const rp=e.target.closest('.btn,.hbtn,.tbn,.pb');if(rp)ripple(e,rp);
  const el=e.target.closest('[data-act],[data-rt],[data-ct],[data-claim],[data-go],[data-adbuy]');if(!el)return;
  if(el.dataset.rt){tap();st.rt=el.dataset.rt;render('rating',false);return}
  if(el.dataset.ct){tap();st.ct=el.dataset.ct;render('contest',false);return}
  const busy=(on)=>{el.disabled=on;el.style.opacity=on?'.6':'1'};
  if(el.dataset.adbuy){tap();busy(true);try{DEMO?await sleep(500):await post('/api/ad_buy',{service_id:el.dataset.adbuy});okH();toast("So'rov yuborildi! Admin bog'lanadi.",'ok')}catch(x){erH();toast(x.message,'err')}busy(false);return}
  if(el.dataset.claim){tap();busy(true);try{let r;if(DEMO){await sleep(500);r=5}else{r=(await post('/api/claim',{id:el.dataset.claim})).reward||0;inval()}okH();confetti();toast(`+${fmt(r)} ⭐ qo'shildi!`,'ok');setTimeout(()=>openTab('bonus',true),500)}catch(x){erH();toast(x.message,'err');busy(false)}return}
  if(el.dataset.go){tap();const t=(st.cache.bonus?.tasks||[]).find(t=>String(t.id)===el.dataset.go);
    if(t?.link){if(t.link.startsWith('http'))tg?tg.openLink(t.link):window.open(t.link,'_blank');else openTg(`https://t.me/${t.link.replace('@','')}`);setTimeout(()=>{st.cache.bonus=null;openTab('bonus',true)},1500)}else toast('Vazifa bot ichida bajariladi');return}
  const a=el.dataset.act;
  if(a==='retry'){openTab(st.cur,true);return}
  if(a==='donate'){tap();openTg(`https://t.me/${BOT}?start=donate`);return}
  if(a==='copy'){tap();copyLink();return}
  if(a==='share'){tap();if(!st.ref){toast("Avval «Asosiy» bo'limini oching",'err');return}
    openTg(`https://t.me/share/url?url=${encodeURIComponent(st.ref)}&text=${encodeURIComponent("🚀 StarRush botga qo'shiling!\n\n🎁 Har bir do'st uchun Stars\n🔥 Kunlik bonus va vazifalar\n🏆 Reytingda birinchi bo'ling\n\n👉 "+st.ref)}`);return}
  if(a==='promo'){tap();const inp=$('promoInput'),code=(inp?.value||'').trim().toUpperCase();
    if(!code){inp.parentElement.classList.remove('shake');void inp.offsetWidth;inp.parentElement.classList.add('shake');toast('Promokodni kiriting','err');erH();return}
    busy(true);try{let r;if(DEMO){await sleep(500);r=3}else{r=(await post('/api/promo',{code})).reward||0;inval()}okH();confetti();toast(`+${fmt(r)} ⭐ qo'shildi!`,'ok');inp.value=''}catch(x){erH();toast(x.message,'err')}busy(false)}
});
$('refresh').onclick=()=>{tap();openTab(st.cur,true)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!st.busy&&st.cache[st.cur])openTab(st.cur,true)});
addEventListener('resize',movePill);

const TABS=[['home','Asosiy',I.home],['contest','Konkurs',I.crown],['bonus','Bonus',I.flame],['rating','Reyting',I.rank],['friends',"Do'stlar",I.users],['advertise','Reklama',I.mega]];
$('nav').innerHTML='<span class="pill" id="pill"></span>'+TABS.map(([id,l,ic])=>`<button class="tab" data-tab="${id}" aria-label="${l}" aria-current="false">${ic}<span>${l}</span></button>`).join('');
$('nav').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;tap();openTab(b.dataset.tab,false)};
const uid=tg?.initDataUnsafe?.user?.id;st.ref=uid?`https://t.me/${BOT}?start=ref_${uid}`:`https://t.me/${BOT}`;
document.fonts?.ready.then(movePill);openTab('home',true);
</script>
</body>
</html>

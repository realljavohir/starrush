<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>StarRush</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --text:#0F1420; --muted:#667085; --line:#E3E7EE;
  --navy:#0E1A3A; --on-navy:#FFFFFF; --on-navy-muted:rgba(255,255,255,.64); --track:rgba(255,255,255,.16);
  --gold:#F6B73C; --on-gold:#0E1A3A; --tint:#EEF2FB; --icon:#2F4A9E;
  --danger:#C62A1E; --danger-bg:#FDECEA; --ok:#17744A; --ok-bg:#E4F4EB; --wait:#8A5A00; --wait-bg:#FFF3D6;
  --track-d:#E3E7EE;
  --pink:#E23E7B; --pink-bg:#FDEDF4;
  --font:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#0A0F1E; --surface:#121A30; --text:#EDF0F7; --muted:#8C97B2; --line:#202A45;
  --navy:#1B2C63; --tint:#1A2547; --icon:#8FA8F5; --danger:#FF8A80; --danger-bg:#3A1A1D;
  --ok:#6FD3A0; --ok-bg:#12301F; --wait:#F6C96B; --wait-bg:#3A2D0E; --track-d:#202A45;
  --pink:#FF7BA8; --pink-bg:#3A1A28;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--text);min-height:100vh;
  padding:max(16px,env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));overflow-x:hidden;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{display:block;flex-shrink:0}

/* Header */
.top{display:flex;align-items:center;gap:12px;padding:8px 0 18px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.who{flex:1;min-width:0}
.name{font-size:17px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handle{font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.icon-btn:active svg{transform:rotate(180deg);transition:transform .3s}

/* Balance */
.balance{background:var(--navy);color:var(--on-navy);border-radius:24px;padding:22px 22px 20px}
.b-label{font-size:14px;font-weight:600;color:var(--on-navy-muted)}
.b-value{display:flex;align-items:center;gap:10px;margin:6px 0 20px;font-size:56px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.b-value svg{width:38px;height:38px;color:var(--gold)}
.lvl-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;font-weight:600;margin-bottom:10px}
.lvl-row span:last-child{color:var(--on-navy-muted);font-variant-numeric:tabular-nums;font-weight:500}
.track{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;background:var(--gold);border-radius:4px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.next{font-size:13px;color:var(--on-navy-muted);margin-top:10px;font-weight:500}

/* Cards / lists */
.h2{font-size:15px;font-weight:800;margin:22px 4px 10px}
.list{background:var(--surface);border-radius:20px;margin-top:14px;border:1px solid var(--line);overflow:hidden}
.h2 + .list{margin-top:0}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px}
.row + .row{border-top:1px solid var(--line)}
.row.me{background:var(--tint)}
.ico{width:36px;height:36px;border-radius:10px;background:var(--tint);color:var(--icon);display:grid;place-items:center;font-size:18px}
.ico svg{width:20px;height:20px}
.row.me .ico{background:var(--surface)}
.ico.pink{background:var(--pink-bg);color:var(--pink)}
.col{flex:1;min-width:0}
.l{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--muted);margin-top:2px;font-weight:500}
.v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.v small{font-weight:600;color:var(--muted);font-size:13px}
.rk{width:30px;text-align:center;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.gap{height:1px;background:var(--line)}
.dots{padding:6px 16px;text-align:center;color:var(--muted);letter-spacing:4px;font-weight:700;border-top:1px solid var(--line)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.chip svg{width:13px;height:13px}
.c-wait{background:var(--wait-bg);color:var(--wait)}
.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-bad{background:var(--danger-bg);color:var(--danger)}
.c-gold{background:var(--gold);color:var(--on-gold)}
.c-tint{background:var(--tint);color:var(--icon)}
.c-pink{background:var(--pink-bg);color:var(--pink)}

/* Gift progress */
.mini{height:6px;background:var(--track-d);border-radius:3px;overflow:hidden;margin-top:8px}
.mini i{display:block;height:100%;background:var(--gold);border-radius:3px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;gap:16px}
.sum > div{flex:1}
.sum .k{font-size:13px;color:var(--muted);font-weight:600}
.sum .n{font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}

/* Tabs (segmented) */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin:14px 0 0;gap:4px}
.seg button{flex:1;height:40px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--navy);color:#fff}
[data-theme="dark"] .seg button.on{background:var(--tint);color:var(--text)}
.seg button svg{width:16px;height:16px}

/* Levels roadmap */
.lv.locked{opacity:.62}
.lv .ico.done{background:var(--ok-bg);color:var(--ok)}
.lv .ico.now{background:var(--gold);color:var(--on-gold)}

/* Buttons */
.btns{display:flex;gap:10px;margin-top:14px}
.primary{flex:1;height:52px;border-radius:14px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.primary:active{opacity:.88}
.primary.pink{background:var(--pink)}
.secondary{width:52px;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.secondary:active{background:var(--tint)}
.ghost{width:100%;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:700;margin-top:14px}
.ghost:active{background:var(--tint)}
.ghost.donate{background:var(--pink);color:#fff;border-color:var(--pink)}
.ghost.donate:active{opacity:.9}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:480px;margin:0 auto;display:flex;gap:2px}
.tab{flex:1;min-width:0;height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--text);background:var(--surface)}
.tab[aria-current="page"] svg{color:var(--icon)}

/* States */
.sk{background:var(--line);border-radius:12px;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.err{background:var(--danger-bg);color:var(--danger);border-radius:20px;padding:20px}
.err b{display:block;font-size:16px;margin-bottom:4px}
.err p{font-size:14px;line-height:1.45;margin-bottom:14px}
.err button{height:42px;padding:0 18px;border-radius:12px;background:var(--danger);color:var(--surface);font-weight:700;font-size:14px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 20px;text-align:center}
.empty b{display:block;font-size:16px;margin-bottom:6px}
.empty p{font-size:14px;color:var(--muted);line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.sk{animation:none}.fill,.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="avatar" id="avatar" aria-hidden="true"></div>
    <div class="who">
      <div class="name" id="name"></div>
      <div class="handle" id="handle"></div>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Yangilash">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>
  <main id="content" aria-live="polite"></main>
</div>

<nav class="nav" aria-label="Bo'limlar"><div class="nav-in" id="nav"></div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
const tg = window.Telegram?.WebApp;
const API_URL = 'https://starrush.onrender.com';
const BOT_USERNAME = 'StarRushUZBot';
const MAX_LEVEL = 999999999;
const $ = id => document.getElementById(id);
let refLink = '';
let current = 'home';
const cache = {};
let ratingTab = 'stars';

/* Theme */
const dark = (tg?.colorScheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
document.documentElement.dataset.theme = dark ? 'dark' : 'light';
if (tg) {
  tg.ready(); tg.expand();
  const bg = dark ? '#0A0F1E' : '#EEF1F6';
  try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); tg.setBottomBarColor?.(bg); } catch (e) {}
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
const fmt = n => Number(n || 0).toLocaleString('ru-RU');
const tap = () => { try { tg?.HapticFeedback?.impactOccurred('light'); } catch (e) {} };
const fmtDate = iso => {
  if (!iso) return '—';
  const [y, m, d] = String(iso).slice(0, 10).split('-');
  return d && m && y ? `${d}.${m}.${y}` : '—';
};
const fmtTime = iso => String(iso || '').slice(11, 16);

/* Icons */
const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8L12 2.5z"/></svg>';
const I = {
  users: svg('<path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'),
  rank: svg('<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>'),
  level: svg('<path d="M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12Z"/><path d="M8.2 13.9 7 22l5-3 5 3-1.2-8.1"/>'),
  week: svg('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
  home: svg('<path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/>'),
  gift: svg('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>'),
  hist: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  send: svg('<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/>'),
  copy: svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  lock: svg('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  check: svg('<path d="M20 6 9 17l-5-5"/>'),
  x: svg('<path d="M18 6 6 18M6 6l12 12"/>'),
  clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  heart: svg('<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8Z"/>'),
};

const TABS = [
  { id: 'home',    label: 'Asosiy',  icon: I.home },
  { id: 'rating',  label: 'Reyting', icon: I.rank },
  { id: 'donate',  label: 'Donat',   icon: I.heart },
  { id: 'gifts',   label: 'Giftlar', icon: I.gift },
  { id: 'friends', label: "Do'stlar", icon: I.users },
  { id: 'history', label: 'Tarix',   icon: I.hist },
];

/* API */
async function api(path) {
  if (!tg?.initData) throw new Error('Ilovani Telegram ichidagi bot orqali oching.');
  let res;
  try {
    res = await fetch(`${API_URL}${path}`, { headers: { 'X-Telegram-Init-Data': tg.initData } });
  } catch (e) {
    throw new Error("Internet aloqasini tekshirib, qayta urinib ko'ring.");
  }
  let data;
  try { data = await res.json(); } catch (e) { throw new Error("Server javobini o'qib bo'lmadi."); }
  if (data.error) throw new Error(data.error);
  return data;
}

/* Shared UI pieces */
function skeleton() {
  $('content').innerHTML = `
    <div class="sk" style="height:150px;border-radius:24px"></div>
    <div class="sk" style="height:168px;border-radius:20px;margin-top:14px"></div>`;
}
function showError(msg) {
  $('content').innerHTML = `
    <div class="err">
      <b>Ma'lumotni yuklab bo'lmadi</b>
      <p>${esc(msg)}</p>
      <button data-act="retry">Qayta urinish</button>
    </div>`;
}
function shareButtons() {
  return `<div class="btns">
    <button class="primary" data-act="share">${I.send.replace('<svg', '<svg width="20" height="20"')} Havolani ulashish</button>
    <button class="secondary" data-act="copy" aria-label="Havolani nusxalash">${I.copy.replace('<svg', '<svg width="20" height="20"')}</button>
  </div>`;
}
function countUp(el, to) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || to < 2) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 700;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function setHeader(d) {
  $('avatar').textContent = (d.first_name || 'U').charAt(0).toUpperCase();
  $('name').textContent = d.first_name || 'User';
  $('handle').textContent = d.username ? '@' + d.username : "Username yo'q";
}

/* ---------- HOME ---------- */
function renderHome({ profile: d, levels: lv }) {
  setHeader(d);
  const stars = Number(d.stars) || 0;
  const isMax = Number(d.level_max) >= MAX_LEVEL;
  const span = d.level_max - d.level_min;
  const pct = isMax ? 100 : span > 0 ? Math.max(0, Math.min(100, (stars - d.level_min) / span * 100)) : 100;
  const left = Math.max(0, d.level_max + 1 - stars);
  const rightLabel = isMax ? '' : `${fmt(stars)} / ${fmt(d.level_max)}`;
  const nextLabel = isMax ? 'Siz eng yuqori darajadasiz' : `Keyingi darajagacha ${fmt(left)} stars qoldi`;

  refLink = `https://t.me/${BOT_USERNAME}?start=ref_${d.user_id}`;

  const levelRows = lv.levels.map(l => {
    const lmax = Number(l.max) >= MAX_LEVEL;
    const state = lv.stars > l.max ? 'done' : lv.stars >= l.min ? 'now' : 'locked';
    const range = lmax ? `${fmt(l.min)}+ ⭐` : `${fmt(l.min)} – ${fmt(l.max)} ⭐`;
    const badge = state === 'now' ? '<span class="chip c-gold">Siz shu yerdasiz</span>'
                : state === 'done' ? `<span class="chip c-ok">${I.check} O'tildi</span>`
                : `<span class="chip c-tint">${I.lock} Yopiq</span>`;
    return `<div class="row lv ${state === 'locked' ? 'locked' : ''}">
      <div class="ico ${state}">${esc(l.emoji)}</div>
      <div class="col"><div class="l">${esc(l.name)}</div><div class="sub">${range}</div></div>
      ${badge}
    </div>`;
  }).join('');

  $('content').innerHTML = `
    <section class="balance" aria-label="Balans">
      <div class="b-label">Balans</div>
      <div class="b-value"><span id="bal">0</span>${STAR}</div>
      <div class="lvl-row"><span>${esc(d.level_emoji)} ${esc(d.level_name)}</span><span>${rightLabel}</span></div>
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><div class="fill" id="fill"></div></div>
      <div class="next">${nextLabel}</div>
    </section>

    ${shareButtons()}

    <section class="list" aria-label="Statistika">
      <div class="row"><div class="ico">${I.users}</div><div class="col"><div class="l">Taklif qilgan do'stlar</div></div><div class="v">${fmt(d.referrals)}</div></div>
      <div class="row"><div class="ico">${I.week}</div><div class="col"><div class="l">Bu hafta</div></div><div class="v">+${fmt(d.week_referrals)}</div></div>
      <div class="row"><div class="ico pink">${I.heart}</div><div class="col"><div class="l">Donat qilgan</div></div><div class="v">${fmt(d.donated)} <small>⭐</small></div></div>
      <div class="row"><div class="ico">${I.rank}</div><div class="col"><div class="l">Reytingdagi o'rin</div></div><div class="v">#${fmt(d.rank)}</div></div>
    </section>

    <h2 class="h2">Darajalar yo'li</h2>
    <section class="list" aria-label="Darajalar">${levelRows}</section>`;

  countUp($('bal'), stars);
  requestAnimationFrame(() => requestAnimationFrame(() => { const f = $('fill'); if (f) f.style.width = pct + '%'; }));
}

/* ---------- RATING (3 tab) ---------- */
function renderRating(d) {
  const medal = r => r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : r;

  const seg = `
    <div class="seg" role="tablist">
      <button role="tab" data-rt="stars" class="${ratingTab==='stars'?'on':''}">${STAR.replace('<svg','<svg width="16" height="16"')} Stars</button>
      <button role="tab" data-rt="donate" class="${ratingTab==='donate'?'on':''}">${I.heart.replace('<svg','<svg width="16" height="16"')} Donat</button>
      <button role="tab" data-rt="ref" class="${ratingTab==='ref'?'on':''}">${I.users.replace('<svg','<svg width="16" height="16"')} Referal</button>
    </div>`;

  let body = '';
  if (ratingTab === 'stars') {
    const rows = d.stars.top.map(x => `
      <div class="row ${x.is_me ? 'me' : ''}">
        <div class="rk">${medal(x.rank)}</div>
        <div class="col"><div class="l">${esc(x.level_emoji)} ${esc(x.name)}${x.is_me ? ' (siz)' : ''}</div></div>
        <div class="v">${fmt(x.stars)} <small>⭐</small></div>
      </div>`).join('');
    const meRow = d.stars.top.some(x => x.is_me) ? '' : `
      <div class="dots" aria-hidden="true">· · ·</div>
      <div class="row me">
        <div class="rk">${fmt(d.stars.me.rank)}</div>
        <div class="col"><div class="l">${esc(d.stars.me.name)} (siz)</div></div>
        <div class="v">${fmt(d.stars.me.stars)} <small>⭐</small></div>
      </div>`;
    body = `<section class="list" style="margin-top:0">${rows || '<div class="row"><div class="l">Reyting bo\'sh</div></div>'}${meRow}</section>`;
  } else if (ratingTab === 'donate') {
    const rows = d.donate.top.map(x => `
      <div class="row ${x.is_me ? 'me' : ''}">
        <div class="rk">${medal(x.rank)}</div>
        <div class="col"><div class="l">${esc(x.name)}${x.is_me ? ' (siz)' : ''}</div><div class="sub">${fmt(x.count)} ta donat</div></div>
        <div class="v">${fmt(x.total)} <small>⭐</small></div>
      </div>`).join('');
    const meRow = d.donate.top.some(x => x.is_me) ? '' : `
      <div class="dots" aria-hidden="true">· · ·</div>
      <div class="row me">
        <div class="rk">${fmt(d.donate.me.rank)}</div>
        <div class="col"><div class="l">${esc(d.donate.me.name)} (siz)</div><div class="sub">${fmt(d.donate.me.count)} ta donat</div></div>
        <div class="v">${fmt(d.donate.me.total)} <small>⭐</small></div>
      </div>`;
    body = `<section class="list" style="margin-top:0">${rows || '<div class="row"><div class="l">Hozircha donat yo\'q</div></div>'}${meRow}</section>`;
  } else {
    const rows = d.ref.top.map(x => `
      <div class="row ${x.is_me ? 'me' : ''}">
        <div class="rk">${medal(x.rank)}</div>
        <div class="col"><div class="l">${esc(x.name)}${x.is_me ? ' (siz)' : ''}</div></div>
        <div class="v">${fmt(x.count)} <small>ta</small></div>
      </div>`).join('');
    const meRow = d.ref.top.some(x => x.is_me) ? '' : `
      <div class="dots" aria-hidden="true">· · ·</div>
      <div class="row me">
        <div class="rk">${fmt(d.ref.me.rank)}</div>
        <div class="col"><div class="l">${esc(d.ref.me.name)} (siz)</div></div>
        <div class="v">${fmt(d.ref.me.count)} <small>ta</small></div>
      </div>`;
    body = `<section class="list" style="margin-top:0">${rows || '<div class="row"><div class="l">Hozircha referal yo\'q</div></div>'}${meRow}</section>`;
  }

  $('content').innerHTML = `
    <section class="sum" aria-label="Sizning o'rningiz">
      <div><div class="k">Sizning o'rningiz</div><div class="n">#${fmt(d.stars.me.rank)}</div></div>
      <div><div class="k">Stars</div><div class="n">${fmt(d.stars.me.stars)}</div></div>
    </section>
    ${seg}
    <h2 class="h2">TOP 10</h2>
    ${body}`;
}

/* ---------- DONATE ---------- */
function renderDonate(d) {
  const rows = d.top.map(x => `
    <div class="row ${x.is_me ? 'me' : ''}">
      <div class="rk">${x.rank === 1 ? '🥇' : x.rank === 2 ? '🥈' : x.rank === 3 ? '🥉' : x.rank}</div>
      <div class="col"><div class="l">${esc(x.name)}${x.is_me ? ' (siz)' : ''}</div><div class="sub">${fmt(x.count)} ta</div></div>
      <div class="v">${fmt(x.total)} <small>⭐</small></div>
    </div>`).join('');

  $('content').innerHTML = `
    <section class="sum" aria-label="Donat">
      <div><div class="k">Siz donat qilgansiz</div><div class="n">${fmt(d.me.total)} ⭐</div></div>
      <div><div class="k">Sizning o'rningiz</div><div class="n">#${fmt(d.me.rank)}</div></div>
    </section>

    <button class="ghost donate" data-act="donate">${I.heart.replace('<svg','<svg width="20" height="20"')} Donat qilish</button>

    <h2 class="h2">Eng ko'p donat qilganlar</h2>
    <section class="list" style="margin-top:0">${rows || '<div class="row"><div class="l">Hozircha donat yo\'q</div></div>'}</section>
    <p class="sub" style="margin:10px 4px 0;text-align:center">Donat — botni qo'llab-quvvatlash uchun. Har bir donat reytingda ko'rinadi.</p>`;
}

/* ---------- GIFTS ---------- */
function renderGifts(d) {
  const rows = d.gifts.map(g => {
    const ok = d.free >= g.stars;
    const need = g.stars - d.free;
    const pct = Math.max(0, Math.min(100, d.free / g.stars * 100));
    return `<div class="row">
      <div class="ico">${esc(g.emoji)}</div>
      <div class="col">
        <div class="l">${esc(g.name)}</div>
        <div class="sub">${fmt(g.stars)} ⭐</div>
        ${ok ? '' : `<div class="mini" aria-hidden="true"><i style="width:${pct.toFixed(0)}%"></i></div>`}
      </div>
      ${ok ? '<span class="chip c-gold">Olish mumkin</span>' : `<span class="chip c-tint">Yana ${fmt(need)} ⭐</span>`}
    </div>`;
  }).join('');
  $('content').innerHTML = `
    <section class="sum" aria-label="Balans">
      <div><div class="k">Balans</div><div class="n">${fmt(d.balance)} ⭐</div></div>
      <div><div class="k">Bo'sh balans</div><div class="n">${fmt(d.free)} ⭐</div></div>
    </section>
    <h2 class="h2">Giftlar katalogi</h2>
    <section class="list" style="margin-top:0">${rows || '<div class="row"><div class="l">Hozircha giftlar yo\'q</div></div>'}</section>
    <button class="ghost" data-act="close">Botda yechib olish</button>
    <p class="sub" style="margin:10px 4px 0;text-align:center">Bo'sh balans — kutilayotgan so'rovlardan keyin qolgan stars.</p>`;
}

/* ---------- FRIENDS ---------- */
function renderFriends(d) {
  const rows = d.items.map(x => `
    <div class="row">
      <div class="ico">${esc((x.name || 'U').charAt(0).toUpperCase())}</div>
      <div class="col"><div class="l">${esc(x.name)}</div><div class="sub">${fmtDate(x.joined_at)}</div></div>
      <span class="chip c-ok">+${fmt(d.reward)} ⭐</span>
    </div>`).join('');
  $('content').innerHTML = `
    <section class="sum" aria-label="Do'stlar statistikasi">
      <div><div class="k">Jami</div><div class="n">${fmt(d.total)}</div></div>
      <div><div class="k">Bu hafta</div><div class="n">+${fmt(d.week)}</div></div>
    </section>
    ${shareButtons()}
    <h2 class="h2">Taklif qilganlar</h2>
    ${d.items.length
      ? `<section class="list" style="margin-top:0">${rows}</section>${d.total > d.items.length ? `<p class="sub" style="margin:10px 4px 0;text-align:center">Oxirgi ${d.items.length} tasi ko'rsatilgan</p>` : ''}`
      : `<div class="empty"><b>Hali do'st taklif qilmagansiz</b><p>Havolani ulashing — har bir tasdiqlangan do'st uchun ${fmt(d.reward)} ⭐ olasiz.</p></div>`}`;
}

/* ---------- HISTORY ---------- */
const STATUS = {
  pending:    { cls: 'c-wait', icon: I.clock, text: 'Kutilmoqda' },
  processing: { cls: 'c-wait', icon: I.clock, text: 'Jarayonda' },
  approved:   { cls: 'c-ok',   icon: I.check, text: 'Tasdiqlandi' },
  rejected:   { cls: 'c-bad',  icon: I.x,     text: 'Rad etildi' },
  failed:     { cls: 'c-bad',  icon: I.x,     text: 'Xato' },
};
function renderHistory(d) {
  if (!d.items.length) {
    $('content').innerHTML = `<div class="empty"><b>So'rovlar yo'q</b><p>Yechib olish so'rovlaringiz shu yerda ko'rinadi.</p></div>`;
    return;
  }
  const rows = d.items.map(x => {
    const st = STATUS[x.status] || STATUS.pending;
    const isGift = x.type === 'gift';
    const title = isGift ? `${esc(x.gift_name || 'Gift')}` : 'Stars yechib olish';
    const emoji = isGift ? esc(x.gift_emoji || '🎁') : '⭐';
    return `<div class="row">
      <div class="ico">${emoji}</div>
      <div class="col"><div class="l">${title}</div><div class="sub">${fmtDate(x.created_at)} ${fmtTime(x.created_at)} · #${x.id}</div></div>
      <div style="text-align:right">
        <div class="v">${fmt(x.stars)} <small>⭐</small></div>
        <div style="margin-top:4px"><span class="chip ${st.cls}">${st.icon}${st.text}</span></div>
      </div>
    </div>`;
  }).join('');
  $('content').innerHTML = `<section class="list" style="margin-top:0">${rows}</section>
    <p class="sub" style="margin:10px 4px 0;text-align:center">Oxirgi 20 ta so'rov</p>`;
}

/* ---------- Loaders ---------- */
const LOADERS = {
  home: async () => {
    const [profile, levels] = await Promise.all([api('/api/profile'), api('/api/levels')]);
    return { profile, levels };
  },
  rating:  () => api('/api/rating'),
  donate:  () => api('/api/donations'),
  gifts:   () => api('/api/gifts'),
  friends: () => api('/api/referrals'),
  history: () => api('/api/withdrawals'),
};
const RENDERERS = { home: renderHome, rating: renderRating, donate: renderDonate, gifts: renderGifts, friends: renderFriends, history: renderHistory };

async function openTab(id, force) {
  current = id;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === id ? 'page' : 'false'));
  if (cache[id] && !force) { RENDERERS[id](cache[id]); return; }
  skeleton();
  try {
    const data = await LOADERS[id]();
    cache[id] = data;
    if (current === id) RENDERERS[id](data);
  } catch (e) {
    if (current === id) showError(e.message);
  }
}

/* ---------- Events ---------- */
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.id);
  toast.id = setTimeout(() => t.classList.remove('on'), 1800);
}

async function copyLink() {
  try {
    await navigator.clipboard.writeText(refLink);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = refLink; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  toast('Havola nusxalandi');
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act], [data-rt]');
  if (!el) return;

  // Reyting tablari
  if (el.dataset.rt) {
    tap();
    ratingTab = el.dataset.rt;
    if (cache.rating) renderRating(cache.rating);
    return;
  }

  tap();
  const act = el.dataset.act;
  if (act === 'retry') { openTab(current, true); return; }
  if (act === 'close') { tg ? tg.close() : null; return; }
  if (act === 'donate') {
    // Donat qilish uchun botni ochamiz
    const url = `https://t.me/${BOT_USERNAME}`;
    tg ? tg.openTelegramLink(url) : window.open(url);
    return;
  }
  if (!refLink) { toast("Avval «Asosiy» bo'limini oching"); return; }
  if (act === 'share') {
    const text = "Star Rush botga qo'shiling va Stars yig'ing!";
    const url = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(text)}`;
    tg ? tg.openTelegramLink(url) : window.open(url);
  } else if (act === 'copy') {
    copyLink();
  }
});

$('refresh').onclick = () => { tap(); openTab(current, true); };

$('nav').innerHTML = TABS.map(t =>
  `<button class="tab" data-tab="${t.id}" aria-current="false">${t.icon}<span>${t.label}</span></button>`).join('');
$('nav').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b) return;
  tap();
  openTab(b.dataset.tab, false);
});

/* Start */
if (!tg?.initData) {
  showError('Ilovani Telegram ichidagi bot orqali oching.');
} else {
  const uid = tg.initDataUnsafe?.user?.id;
  if (uid) refLink = `https://t.me/${BOT_USERNAME}?start=ref_${uid}`;
  openTab('home', true);
}
</script>
</body>
</html>

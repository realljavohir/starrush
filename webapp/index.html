<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0E16" id="metaTheme">
<title>StarRush</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   DESIGN TOKENS — LIGHT (default)
   ═══════════════════════════════════════════════════════════ */
:root{
  --bg:#F5F7FB;
  --bg-2:#EEF2F9;
  --surface:#FFFFFF;
  --surface-2:#FAFBFE;
  --surface-3:#F2F5FA;
  --text:#0A0E1A;
  --text-2:#3F4759;
  --muted:#7A8399;
  --line:#E8ECF3;
  --line-2:#DFE4EE;

  --brand:#0B0E16;
  --brand-2:#1A2035;
  --on-brand:#FFFFFF;
  --on-brand-muted:rgba(255,255,255,.62);

  --accent:#F6B93B;
  --accent-2:#FFD26A;
  --accent-ink:#3D2600;

  --violet:#6C5CE7;
  --violet-2:#A29BFE;
  --violet-soft:#EFEBFF;

  --mint:#00B894;
  --mint-soft:#DFF7F0;

  --rose:#E84393;
  --rose-soft:#FDEBF4;

  --sky:#0984E3;
  --sky-soft:#E6F2FD;

  --danger:#D63031;
  --danger-soft:#FDEAEA;

  --warn:#E17055;
  --warn-soft:#FFF0EB;

  --radius-xs:10px;
  --radius-sm:14px;
  --radius-md:18px;
  --radius-lg:24px;
  --radius-xl:32px;
  --radius-full:999px;

  --shadow-xs:0 1px 2px rgba(10,14,26,.04);
  --shadow-sm:0 2px 8px -2px rgba(10,14,26,.06), 0 1px 2px rgba(10,14,26,.04);
  --shadow-md:0 12px 32px -8px rgba(10,14,26,.12), 0 2px 6px -2px rgba(10,14,26,.06);
  --shadow-lg:0 28px 64px -16px rgba(10,14,26,.22), 0 8px 20px -8px rgba(10,14,26,.10);
  --shadow-glow:0 12px 32px -8px rgba(246,185,59,.4);

  --font:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}

/* ═══════════════════════════════════════════════════════════
   DARK THEME
   ═══════════════════════════════════════════════════════════ */
[data-theme="dark"]{
  --bg:#07090F;
  --bg-2:#0A0D15;
  --surface:#0F131C;
  --surface-2:#141923;
  --surface-3:#1A202C;
  --text:#F5F7FB;
  --text-2:#B8BFCF;
  --muted:#7C8699;
  --line:#1E2430;
  --line-2:#262D3B;

  --brand:#1C2233;
  --brand-2:#2A3245;

  --violet-soft:#1B1733;
  --mint-soft:#0D2620;
  --rose-soft:#2A1521;
  --sky-soft:#0C1F33;
  --danger-soft:#2A1416;
  --warn-soft:#2A1A14;

  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow-sm:0 2px 8px -2px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 12px 32px -8px rgba(0,0,0,.5), 0 2px 6px -2px rgba(0,0,0,.3);
  --shadow-lg:0 28px 64px -16px rgba(0,0,0,.6), 0 8px 20px -8px rgba(0,0,0,.4);
  --shadow-glow:0 12px 32px -8px rgba(246,185,59,.25);
}

/* ═══════════════════════════════════════════════════════════
   RESET & BASE — ranglar silliq o'tadi
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{
  background:var(--bg);color:var(--text);
  transition:background-color .3s var(--ease), color .3s var(--ease);
}
body{
  font-family:var(--font);
  font-size:15px;
  line-height:1.5;
  letter-spacing:-.011em;
  min-height:100vh;
  padding:max(12px,env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom));
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;outline:none;width:100%}
img,svg{display:block;max-width:100%}
svg{flex-shrink:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:var(--accent);color:var(--accent-ink)}

.wrap{max-width:440px;margin:0 auto}
.h2{font-size:16px;font-weight:700;letter-spacing:-.018em;line-height:1.3;margin:24px 4px 12px;display:flex;align-items:center;gap:10px}
.h2 .h2-count{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-3);padding:3px 9px;border-radius:var(--radius-full);letter-spacing:0}
.body-sm{font-size:13.5px;font-weight:500;color:var(--text-2);line-height:1.55}

/* ═══════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════ */
.top{display:flex;align-items:center;gap:12px;padding:6px 2px 18px}
.avatar{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:17px;letter-spacing:-.02em;
  box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;flex-shrink:0;
}
.avatar::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.14));pointer-events:none}
.who{flex:1;min-width:0}
.name{font-size:16px;font-weight:700;letter-spacing:-.018em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.handle{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;gap:8px;flex-shrink:0}
.icon-btn{
  width:40px;height:40px;border-radius:13px;
  display:grid;place-items:center;
  color:var(--text-2);background:var(--surface);
  border:1px solid var(--line);
  box-shadow:var(--shadow-xs);
  transition:transform .18s var(--ease-spring),background-color .2s var(--ease),color .3s var(--ease);
  flex-shrink:0;
}
.icon-btn:active{transform:scale(.92);background:var(--surface-3)}
.icon-btn svg{width:19px;height:19px;transition:transform .4s var(--ease-spring),opacity .3s var(--ease)}
.icon-btn .icon-sun,
.icon-btn .icon-moon{
  position:absolute;
  transition:transform .4s var(--ease-spring),opacity .3s var(--ease);
}
.icon-btn{position:relative;overflow:hidden}
.icon-btn .icon-sun{transform:rotate(0) scale(1);opacity:0}
.icon-btn .icon-moon{transform:rotate(0) scale(1);opacity:1}
[data-theme="dark"] .icon-btn .icon-sun{transform:rotate(180deg) scale(1);opacity:1}
[data-theme="dark"] .icon-btn .icon-moon{transform:rotate(-180deg) scale(.5);opacity:0}

/* ═══════════════════════════════════════════════════════════
   HERO BALANCE
   ═══════════════════════════════════════════════════════════ */
.balance{
  position:relative;
  background:linear-gradient(155deg,#0B0E16 0%,#161B2E 55%,#0F1421 100%);
  color:var(--on-brand);
  border-radius:var(--radius-xl);
  padding:26px 22px 22px;
  overflow:hidden;
  box-shadow:var(--shadow-lg);
  isolation:isolate;
}
.balance::before{content:'';position:absolute;top:-90px;right:-70px;width:280px;height:280px;background:radial-gradient(circle,rgba(246,185,59,.28),transparent 68%);pointer-events:none}
.balance::after{content:'';position:absolute;bottom:-100px;left:-60px;width:240px;height:240px;background:radial-gradient(circle,rgba(108,92,231,.22),transparent 68%);pointer-events:none}
.balance .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:3px 3px;pointer-events:none;opacity:.5}
.b-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--on-brand-muted);position:relative}
.b-value{display:flex;align-items:center;gap:12px;margin:10px 0 22px;font-size:54px;font-weight:800;letter-spacing:-.04em;line-height:1;position:relative}
.b-value .star{width:36px;height:36px;color:var(--accent);filter:drop-shadow(0 6px 14px rgba(246,185,59,.5))}
.b-progress{position:relative}
.b-lvl-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px;font-weight:600;margin-bottom:10px}
.b-lvl-row .lvl-name{display:flex;align-items:center;gap:6px}
.b-lvl-row .lvl-range{color:var(--on-brand-muted);font-weight:600;font-size:12.5px}
.b-track{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;position:relative}
.b-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:3px;transition:width 1.1s var(--ease-out);box-shadow:0 0 14px rgba(246,185,59,.55);position:relative}
.b-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shimmer 2.4s var(--ease) infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.b-next{font-size:12.5px;font-weight:500;color:var(--on-brand-muted);margin-top:10px;position:relative}

/* ═══════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════ */
.btns{display:flex;gap:10px;margin-top:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;height:52px;border-radius:var(--radius-sm);
  font-size:15px;font-weight:700;letter-spacing:-.01em;
  transition:transform .18s var(--ease-spring),background-color .2s var(--ease),opacity .2s var(--ease),color .3s var(--ease);
  user-select:none;
}
.btn:active{transform:scale(.97)}
.btn svg{width:19px;height:19px}
.btn-primary{flex:1;background:linear-gradient(155deg,var(--brand),var(--brand-2));color:#fff;box-shadow:var(--shadow-md)}
.btn-primary:active{background:linear-gradient(155deg,#04060b,#0f1421)}
.btn-secondary{width:52px;background:var(--surface);border:1px solid var(--line);color:var(--text);box-shadow:var(--shadow-xs)}
.btn-ghost{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);box-shadow:var(--shadow-xs);margin-top:12px}
.btn-gold{background:linear-gradient(155deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:var(--shadow-glow);border:0}
.btn-rose{background:linear-gradient(155deg,var(--rose),#FF6FB5);color:#fff;border:0;box-shadow:0 12px 32px -8px rgba(232,67,147,.45)}
.btn:disabled{opacity:.55;cursor:not-allowed;pointer-events:none}

/* ═══════════════════════════════════════════════════════════
   LISTS
   ═══════════════════════════════════════════════════════════ */
.list{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow-xs);transition:background-color .3s var(--ease),border-color .3s var(--ease)}
.row{display:flex;align-items:center;gap:14px;padding:15px 16px;min-height:64px;transition:background-color .15s var(--ease)}
.row + .row{border-top:1px solid var(--line)}
.icon-wrap{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex-shrink:0;background:var(--surface-3);color:var(--text-2);transition:background-color .3s var(--ease),color .3s var(--ease)}
.icon-wrap svg{width:19px;height:19px}
.icon-wrap.violet{background:var(--violet-soft);color:var(--violet)}
.icon-wrap.mint{background:var(--mint-soft);color:var(--mint)}
.icon-wrap.gold{background:rgba(246,185,59,.16);color:#B47800}
.row-body{flex:1;min-width:0}
.row-title{font-size:14.5px;font-weight:600;letter-spacing:-.011em;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:3px;line-height:1.4}

/* ═══════════════════════════════════════════════════════════
   CHIPS
   ═══════════════════════════════════════════════════════════ */
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:var(--radius-full);font-size:11.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;transition:background-color .3s var(--ease),color .3s var(--ease)}
.chip svg{width:12px;height:12px}
.chip-muted{background:var(--surface-3);color:var(--text-2)}
.chip-mint{background:var(--mint-soft);color:var(--mint)}
.chip-gold{background:linear-gradient(155deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 4px 10px -2px rgba(246,185,59,.4)}

/* ═══════════════════════════════════════════════════════════
   STATS
   ═══════════════════════════════════════════════════════════ */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:15px 16px;box-shadow:var(--shadow-xs);transition:transform .18s var(--ease-spring),background-color .3s var(--ease),border-color .3s var(--ease)}
.stat:active{transform:scale(.97)}
.stat-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat-value{display:flex;align-items:baseline;gap:4px;margin-top:6px;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat-value small{font-size:13px;font-weight:700;color:var(--muted)}

/* ═══════════════════════════════════════════════════════════
   SEGMENTED
   ═══════════════════════════════════════════════════════════ */
.seg{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:4px;margin:14px 0 0;box-shadow:var(--shadow-xs);transition:background-color .3s var(--ease),border-color .3s var(--ease)}
.seg button{flex:1;height:38px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .25s var(--ease-out);letter-spacing:-.008em}
.seg button.on{background:linear-gradient(155deg,var(--brand),var(--brand-2));color:#fff;font-weight:700;box-shadow:0 4px 12px -3px rgba(10,14,26,.3)}
[data-theme="dark"] .seg button.on{background:var(--surface-3);color:var(--text)}
.seg button svg{width:14px;height:14px}

/* ═══════════════════════════════════════════════════════════
   HERO CARD
   ═══════════════════════════════════════════════════════════ */
.hero-card{position:relative;background:linear-gradient(155deg,#0B0E16 0%,#1A1F35 50%,#0F1421 100%);color:#fff;border-radius:var(--radius-xl);padding:24px 22px;overflow:hidden;box-shadow:var(--shadow-lg);isolation:isolate}
.hero-card::before{content:'';position:absolute;top:-120px;right:-100px;width:320px;height:320px;background:radial-gradient(circle,rgba(246,185,59,.25),transparent 65%);pointer-events:none}
.hero-card::after{content:'';position:absolute;bottom:-140px;left:-80px;width:280px;height:280px;background:radial-gradient(circle,rgba(232,67,147,.18),transparent 65%);pointer-events:none}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-full);background:rgba(246,185,59,.16);color:var(--accent-2);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;position:relative;border:1px solid rgba(246,185,59,.2)}
.hero-badge svg{width:12px;height:12px}
.hero-title{font-size:22px;font-weight:800;letter-spacing:-.028em;line-height:1.2;margin:14px 0 8px;position:relative}
.hero-desc{font-size:13.5px;font-weight:500;color:rgba(255,255,255,.7);line-height:1.55;position:relative;margin-bottom:18px}
.hero-reward{display:flex;align-items:center;gap:14px;padding:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-md);position:relative}
.hero-reward-emoji{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(246,185,59,.16);flex-shrink:0}
.hero-reward-body{flex:1;min-width:0}
.hero-reward-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.hero-reward-value{font-size:17px;font-weight:700;letter-spacing:-.018em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-timer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;position:relative}
.hero-timer-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 4px;text-align:center}
.hero-timer-num{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.hero-timer-lbl{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:4px}
.hero-btn{width:100%;height:50px;margin-top:16px;border-radius:var(--radius-sm);background:linear-gradient(155deg,var(--accent),var(--accent-2));color:var(--accent-ink);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;box-shadow:0 12px 28px -8px rgba(246,185,59,.5);transition:transform .18s var(--ease-spring);letter-spacing:-.008em}
.hero-btn:active{transform:scale(.97)}
.hero-btn svg{width:18px;height:18px}
.hero-btn.disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.12);box-shadow:none;pointer-events:none}

/* ═══════════════════════════════════════════════════════════
   STREAK
   ═══════════════════════════════════════════════════════════ */
.streak{display:flex;gap:6px;margin:0 0 18px;position:relative}
.streak-dot{flex:1;aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.08);transition:all .3s var(--ease-spring)}
.streak-dot.done,.streak-dot.current{background:linear-gradient(155deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 16px -4px rgba(246,185,59,.5)}
.streak-dot.current{animation:pulse-ring 2s var(--ease-out) infinite}
@keyframes pulse-ring{0%{box-shadow:0 6px 16px -4px rgba(246,185,59,.5),0 0 0 0 rgba(246,185,59,.5)}70%{box-shadow:0 6px 16px -4px rgba(246,185,59,.5),0 0 0 10px rgba(246,185,59,0)}100%{box-shadow:0 6px 16px -4px rgba(246,185,59,.5),0 0 0 0 rgba(246,185,59,0)}}

/* ═══════════════════════════════════════════════════════════
   TASKS
   ═══════════════════════════════════════════════════════════ */
.task{display:flex;align-items:center;gap:12px;padding:14px 16px}
.task + .task{border-top:1px solid var(--line)}
.task.done{background:var(--surface-2)}
.task-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--surface-3);flex-shrink:0}
.task.done .task-icon{background:var(--mint-soft);color:var(--mint)}
.task-body{flex:1;min-width:0}
.task-title{font-size:14px;font-weight:600;letter-spacing:-.011em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-reward{font-size:12px;font-weight:600;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px}
.task-reward .star-mini{color:var(--accent);width:11px;height:11px}
.task-btn{height:36px;padding:0 14px;border-radius:11px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;background:var(--surface-3);color:var(--text-2);transition:all .2s var(--ease-spring);letter-spacing:-.008em}
.task-btn:active{transform:scale(.94)}
.task-btn.claim{background:linear-gradient(155deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 6px 16px -4px rgba(246,185,59,.5)}
.task-btn.claimed{background:var(--mint-soft);color:var(--mint)}
.task-btn.done{background:var(--violet-soft);color:var(--violet)}

/* ═══════════════════════════════════════════════════════════
   PROMO
   ═══════════════════════════════════════════════════════════ */
.promo{display:flex;gap:10px;margin-top:12px}

function getSystemTheme() {
  const tgTheme = tg?.colorScheme;
  if (tgTheme === 'dark' || tgTheme === 'light') return tgTheme;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function getSavedTheme() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'dark' || saved === 'light') return saved;
  } catch (e) {}
  return null;
}

function applyTheme(theme, animate = false) {
  if (animate) {
    document.documentElement.classList.add('theme-transition');
    setTimeout(() => document.documentElement.classList.remove('theme-transition'), 350);
  }
  document.documentElement.dataset.theme = theme;

  // Meta theme-color
  const metaTheme = document.getElementById('metaTheme');
  if (metaTheme) metaTheme.content = theme === 'dark' ? '#07090F' : '#F5F7FB';

  // Telegram WebApp bilan sinxronlashtirish
  if (tg) {
    try {
      const bg = theme === 'dark' ? '#07090F' : '#F5F7FB';
      tg.setHeaderColor?.(bg);
      tg.setBackgroundColor?.(bg);
      tg.setBottomBarColor?.(bg);
    } catch (e) {}
  }
}

// Boshlang'ich tema: saqlangan -> tizim
const initialTheme = getSavedTheme() || getSystemTheme();
applyTheme(initialTheme, false);

function toggleTheme() {
  const current = document.documentElement.dataset.theme;
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next, true);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  try { tg?.HapticFeedback?.impactOccurred('medium'); } catch (e) {}
}

document.getElementById('themeBtn').addEventListener('click', toggleTheme);

// Tizim o'zgarishini kuzatish (agar foydalanuvchi tanlamagan bo'lsa)
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  if (!getSavedTheme()) applyTheme(e.matches ? 'dark' : 'light', true);
});

  try {
    tg.onEvent('themeChanged', () => {
      if (!getSavedTheme()) {

}

async function api(path, opts = {}) {
  if (USE_DEMO_DATA) {
    await new Promise(r => setTimeout(r, 250));
    const key = path.replace('/api/', '').split('?')[0];
    if (DEMO_DATA[key]) return DEMO_DATA[key];
    return {};
  }

  let res;
  try {
    res = await fetch(`${API_URL}${path}`, {
      ...opts,
      headers: {
        'X-Telegram-Init-Data': tg.initData,
        'Accept': 'application/json',
        ...(opts.headers || {})
      }
    });
  } catch (e) {
    throw new Error("Internet aloqasini tekshirib, qayta urinib ko'ring.");
  }

  if (!res.ok) {
    const text = await res.text().catch(() => '');
    try {
      const errData = JSON.parse(text);
      if (errData.error) throw new Error(errData.error);
    } catch (e) {
      if (e.message && !e.message.includes('JSON')) throw e;
    }
    throw new Error(`Server xatosi (${res.status})`);
  }

  const text = await res.text();
  if (!text) throw new Error("Server bo'sh javob qaytardi.");

  let data;
  try { data = JSON.parse(text); }
  catch (e) {
    console.error('JSON parse xatosi:', text.slice(0, 300));
    throw new Error("Server noto'g'ri formatda javob qaytardi.");
  }
  if (data.error) throw new Error(data.error);
  return data;
}

function countUp(el, to) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || to < 2) {
    el.textContent = fmt(to); return;
  }
  const t0 = performance.now(); const dur = 800;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(Math.round(to * eased));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

let toastTimer;
function toast(msg, type = '') {
  const t = $('toast');
  const icon = type === 'ok' ? SVG.check : type === 'err' ? SVG.x : '';
  t.innerHTML = (icon ? icon.replace('<svg', '<svg width="18" height="18"') : '') + `<span>${esc(msg)}</span>`;
  t.className = 'toast on ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast ' + type; }, 2400);
}

function confettiBurst() {
  const c = $('confetti');
  const colors = ['#F6B93B','#FFD26A','#6C5CE7','#00B894','#E84393','#0984E3'];
  for (let i = 0; i < 36; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    p.style.animationDelay = (Math.random() * 0.3) + 's';
    c.appendChild(p);
    setTimeout(() => p.remove(), 3400);
  }
}

      <div class="lb-row ${x.is_me ? 'me' : ''}">
        <div class="lb-rank ${rankCls(x.rank)}">${medal(x.rank)}</div>
        <div class="lb-avatar">${esc((x.name || 'U').charAt(0).toUpperCase())}</div>
        <div class="lb-body"><div class="lb-name">${esc(x.name)}${x.is_me ? '<span class="lb-you">siz</span>' : ''}</div></div>
        <div class="lb-value">${fmt(x.count || 0)}<small>ta</small></div>
      </div>`).join('');
    body = `<section class="list fade-in fade-in-delay-1" style="margin-top:0">${rows || '<div class="lb-row"><div class="lb-body"><div class="lb-sub">Hozircha referal yo\'q</div></div></div>'}</section>`;
  }

  $('content').innerHTML = `
    <div class="stats fade-in" style="margin-top:0">
      <div class="stat"><div class="stat-label">Sizning o'rningiz</div><div class="stat-value">#${fmt(stars.me?.rank || 0)}</div></div>
      <div class="stat"><div class="stat-label">Stars</div><div class="stat-value">${fmt(stars.me?.stars || 0)}</div></div>
    </div>
    ${seg}
    <h2 class="h2 fade-in fade-in-delay-1">
      <span style="color:var(--muted);display:flex;width:18px;height:18px">${SVG.rank}</span>
      <span>TOP 10</span>
    </h2>
    ${body}`;
}

function renderFriends(d) {
  const rows = (d.items || []).map(x => `
    <div class="lb-row">
      <div class="lb-avatar">${esc((x.name || 'U').charAt(0).toUpperCase())}</div>
      <div class="lb-body">
        <div class="lb-name">${esc(x.name)}</div>
        <div class="lb-sub">${fmtDate(x.joined_at)}</div>
      </div>
      <span class="chip chip-mint">+${fmt(d.reward)} ⭐</span>
    </div>`).join('');

  $('content').innerHTML = `
    <div class="stats fade-in" style="margin-top:0">
      <div class="stat"><div class="stat-label">Jami do'stlar</div><div class="stat-value">${fmt(d.total)}</div></div>
      <div class="stat"><div class="stat-label">Bu hafta</div><div class="stat-value">+${fmt(d.week)}</div></div>
    </div>
    <div class="fade-in fade-in-delay-1">${shareButtons()}</div>
    <h2 class="h2 fade-in fade-in-delay-2">
      <span style="color:var(--muted);display:flex;width:18px;height:18px">${SVG.users}</span>
      <span>Taklif qilganlar</span>
    </h2>
    ${(d.items || []).length
      ? `<section class="list fade-in fade-in-delay-2" style="margin-top:0">${rows}</section>`
      : `<div class="empty fade-in fade-in-delay-2">
          <div class="empty-icon">${SVG.users}</div>
          <div class="empty-title">Hali do'st taklif qilmagansiz</div>
          <div class="empty-desc">Havolani ulashing — har bir tasdiqlangan do'st uchun ${fmt(d.reward)} ⭐ olasiz.</div>
        </div>`}`;
}

const LOADERS = {
  home: async () => {
    const [profile, levels] = await Promise.all([api('/api/profile'), api('/api/levels')]);
    return { profile, levels };
  },
  contest: () => api('/api/contest'),
  bonus: () => api('/api/bonus'),
  rating: () => api('/api/rating'),
  friends: () => api('/api/referrals')
};
const RENDERERS = { home: renderHome, contest: renderContest, bonus: renderBonus, rating: renderRating, friends: renderFriends };

async function openTab(id, force = false) {
  if (state.loading) return;
  state.current = id;
  document.querySelectorAll('.tab').forEach(b => {
    b.setAttribute('aria-current', b.dataset.tab === id ? 'page' : 'false');
  });
  if (state.cache[id] && !force) { RENDERERS[id](state.cache[id]); return; }
  state.loading = true;
  skeleton();
  try {
    const data = await LOADERS[id]();
    state.cache[id] = data;
    if (state.current === id) RENDERERS[id](data);
  } catch (e) {
    console.error('Tab xatosi:', e);
    if (state.current === id) showError(e.message);
  } finally {
    state.loading = false;
  }
}

async function copyLink() {
  if (!state.refLink) { toast("Avval «Asosiy» bo'limini oching", 'err'); return; }
  try {
    await navigator.clipboard.writeText(state.refLink);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = state.refLink; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  toast('Havola nusxalandi', 'ok'); ok();
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act], [data-rt], [data-ct], [data-claim], [data-go]');
  if (!el) return;

  if (el.dataset.rt) { tap(); state.ratingTab = el.dataset.rt; if (state.cache.rating) renderRating(state.cache.rating); return; }
  if (el.dataset.ct) { tap(); state.contestTab = el.dataset.ct; if (state.cache.contest) renderContest(state.cache.contest); return; }

  if (el.dataset.claim) {
    tap();
    const id = el.dataset.claim;
    el.disabled = true; el.style.opacity = '.6';
    try {
      if (USE_DEMO_DATA) {
        await new Promise(r => setTimeout(r, 500));
        ok(); confettiBurst();
        toast(`+${id === 'daily' ? 25 : 50} ⭐ qo'shildi!`, 'ok');
        if (id === 'daily' && state.cache.bonus) state.cache.bonus.daily.can_claim = false;
      } else {
        const res = await api('/api/claim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        ok(); confettiBurst();
        toast(`+${fmt(res.reward || 0)} ⭐ qo'shildi!`, 'ok');
        state.cache.bonus = null; state.cache.home = null; state.cache.rating = null;
      }
      setTimeout(() => openTab('bonus', true), 400);
    } catch (err2) {
      err(); toast(err2.message, 'err');
      el.disabled = false; el.style.opacity = '1';
    }
    return;
  }

  if (el.dataset.go) {
    tap();
    const id = el.dataset.go;
    const task = (state.cache.bonus?.tasks || []).find(t => String(t.id) === String(id));
    if (task?.link) {
      const url = task.link.startsWith('http') ? task.link : `https://t.me/${task.link.replace('@','')}`;
      if (task.link.startsWith('http')) tg ? tg.openLink(url) : window.open(url, '_blank');
      else tg ? tg.openTelegramLink(url) : window.open(url, '_blank');
      setTimeout(() => { state.cache.bonus = null; openTab('bonus', true); }, 1500);
    } else {
      toast('Vazifa tez orada qo\'shiladi', '');
    }
    return;
  }

  const act = el.dataset.act;
  if (act === 'retry') { openTab(state.current, true); return; }
  if (act === 'donate') {
    tap();
    const url = `https://t.me/${BOT_USERNAME}`;
    tg ? tg.openTelegramLink(url) : window.open(url, '_blank');
    return;
  }
  if (act === 'promo') {
    tap();
    const input = $('promoInput');
    const code = (input?.value || '').trim().toUpperCase();
    if (!code) { toast('Promokodni kiriting', 'err'); err(); return; }
    el.disabled = true; el.style.opacity = '.6';
    try {
      if (USE_DEMO_DATA) {
        await new Promise(r => setTimeout(r, 500));
        ok(); confettiBurst();
        toast('+100 ⭐ qo\'shildi!', 'ok');
        if (input) input.value = '';
      } else {
        const res = await api('/api/promo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        ok(); confettiBurst();
        toast(`+${fmt(res.reward || 0)} ⭐ qo'shildi!`, 'ok');
        if (input) input.value = '';
        state.cache.bonus = null; state.cache.home = null; state.cache.rating = null;
      }
    } catch (err2) { err(); toast(err2.message, 'err'); }
    el.disabled = false; el.style.opacity = '1';
    return;
  }
  if (act === 'share') {
    tap();
    if (!state.refLink) { toast("Avval «Asosiy» oching", 'err'); return; }
    const text = "🚀 StarRush botga qo'shiling va Stars yig'ing!";
    const url = `https://t.me/share/url?url=${encodeURIComponent(state.refLink)}&text=${encodeURIComponent(text)}`;
    tg ? tg.openTelegramLink(url) : window.open(url, '_blank');
    return;
  }
  if (act === 'copy') { tap(); copyLink(); return; }
});

$('refresh').addEventListener('click', () => { tap(); openTab(state.current, true); });

const TABS = [
  { id: 'home',    label: 'Asosiy',   icon: SVG.home },
  { id: 'contest', label: 'Konkurs',  icon: SVG.crown },
  { id: 'bonus',   label: 'Bonus',    icon: SVG.flame },
  { id: 'rating',  label: 'Reyting',  icon: SVG.rank },
  { id: 'friends', label: "Do'stlar", icon: SVG.users }
];

$('nav').innerHTML = TABS.map(t => `
  <button class="tab" data-tab="${t.id}" aria-current="false">
    ${t.icon}
    <span>${t.label}</span>
  </button>
`).join('');

$('nav').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b) return;
  tap();
  openTab(b.dataset.tab, false);
});

const uid = tg?.initDataUnsafe?.user?.id;
if (uid) state.refLink = `https://t.me/${BOT_USERNAME}?start=ref_${uid}`;
else state.refLink = `https://t.me/${BOT_USERNAME}`;

openTab('home', true);
</script>
</body>
</html>

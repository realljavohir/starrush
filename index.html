<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>StarRush</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --text:#0F1420; --muted:#667085; --line:#E3E7EE;
  --navy:#0E1A3A; --on-navy:#FFFFFF; --on-navy-muted:rgba(255,255,255,.64); --track:rgba(255,255,255,.16);
  --gold:#F6B73C; --tint:#EEF2FB; --icon:#2F4A9E; --danger:#C62A1E; --danger-bg:#FDECEA;
  --font:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#0A0F1E; --surface:#121A30; --text:#EDF0F7; --muted:#8C97B2; --line:#202A45;
  --navy:#1B2C63; --tint:#1A2547; --icon:#8FA8F5; --danger:#FF8A80; --danger-bg:#3A1A1D;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--text);min-height:100vh;
  padding:max(16px,env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom));overflow-x:hidden;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{display:block;flex-shrink:0}

/* Header */
.top{display:flex;align-items:center;gap:12px;padding:8px 0 18px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.who{flex:1;min-width:0}
.name{font-size:17px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handle{font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.icon-btn:active svg{transform:rotate(180deg);transition:transform .3s}

/* Balance */
.balance{background:var(--navy);color:var(--on-navy);border-radius:24px;padding:22px 22px 20px}
.b-label{font-size:14px;font-weight:600;color:var(--on-navy-muted)}
.b-value{display:flex;align-items:center;gap:10px;margin:6px 0 20px;font-size:56px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.b-value svg{width:38px;height:38px;color:var(--gold)}
.lvl-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;font-weight:600;margin-bottom:10px}
.lvl-row span:last-child{color:var(--on-navy-muted);font-variant-numeric:tabular-nums;font-weight:500}
.track{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;background:var(--gold);border-radius:4px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.next{font-size:13px;color:var(--on-navy-muted);margin-top:10px;font-weight:500}

/* List */
.list{background:var(--surface);border-radius:20px;margin-top:14px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:15px 16px}
.row + .row{border-top:1px solid var(--line)}
.ico{width:36px;height:36px;border-radius:10px;background:var(--tint);color:var(--icon);display:grid;place-items:center}
.ico svg{width:20px;height:20px}
.row .l{flex:1;font-size:15px;font-weight:600}
.row .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}

/* Bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar-in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.primary{flex:1;height:52px;border-radius:14px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.primary:active{opacity:.88}
.secondary{width:52px;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.secondary:active{background:var(--tint)}
.bar[hidden]{display:none}

/* States */
.sk{background:var(--line);border-radius:12px;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.err{background:var(--danger-bg);color:var(--danger);border-radius:20px;padding:20px}
.err b{display:block;font-size:16px;margin-bottom:4px}
.err p{font-size:14px;line-height:1.45;margin-bottom:14px}
.err button{height:42px;padding:0 18px;border-radius:12px;background:var(--danger);color:var(--surface);font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.sk{animation:none}.fill,.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="avatar" id="avatar" aria-hidden="true"></div>
    <div class="who">
      <div class="name" id="name"></div>
      <div class="handle" id="handle"></div>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Yangilash">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>
  <main id="content"></main>
</div>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <button class="primary" id="share">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      Havolani ulashish
    </button>
    <button class="secondary" id="copy" aria-label="Havolani nusxalash">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const tg = window.Telegram?.WebApp;
const API_URL = 'https://starrush.onrender.com';
const BOT_USERNAME = 'StarRushUZBot';
const MAX_LEVEL = 999999999;
const $ = id => document.getElementById(id);
let refLink = '';

/* Theme */
const dark = (tg?.colorScheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
document.documentElement.dataset.theme = dark ? 'dark' : 'light';
if (tg) {
  tg.ready(); tg.expand();
  const bg = dark ? '#0A0F1E' : '#EEF1F6';
  try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); tg.setBottomBarColor?.(bg); } catch (e) {}
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
const fmt = n => Number(n || 0).toLocaleString('ru-RU');
const tap = () => { try { tg?.HapticFeedback?.impactOccurred('light'); } catch (e) {} };

const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8L12 2.5z"/></svg>';
const ICON_USERS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
const ICON_RANK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>';
const ICON_LEVEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12Z"/><path d="M8.2 13.9 7 22l5-3 5 3-1.2-8.1"/></svg>';

function skeleton() {
  $('bar').hidden = true;
  $('content').innerHTML = `
    <div class="sk" style="height:196px;border-radius:24px"></div>
    <div class="sk" style="height:168px;border-radius:20px;margin-top:14px"></div>`;
}

function showError(msg) {
  $('bar').hidden = true;
  $('content').innerHTML = `
    <div class="err">
      <b>Ma'lumotni yuklab bo'lmadi</b>
      <p>${esc(msg)}</p>
      <button id="retry">Qayta urinish</button>
    </div>`;
  $('retry').onclick = loadProfile;
}

function countUp(el, to) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || to < 2) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 700;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function render(d) {
  const stars = Number(d.stars) || 0;
  const isMax = Number(d.level_max) >= MAX_LEVEL;
  const span = d.level_max - d.level_min;
  const pct = isMax ? 100 : span > 0 ? Math.max(0, Math.min(100, (stars - d.level_min) / span * 100)) : 100;
  const left = Math.max(0, d.level_max + 1 - stars);

  $('avatar').textContent = (d.first_name || 'U').charAt(0).toUpperCase();
  $('name').textContent = d.first_name || 'User';
  $('handle').textContent = d.username ? '@' + d.username : 'Username yo\'q';

  const rightLabel = isMax ? '' : `${fmt(stars)} / ${fmt(d.level_max)}`;
  const nextLabel = isMax ? 'Siz eng yuqori darajadasiz' : `Keyingi darajagacha ${fmt(left)} stars qoldi`;

  $('content').innerHTML = `
    <section class="balance" aria-label="Balans">
      <div class="b-label">Balans</div>
      <div class="b-value"><span id="bal">0</span>${STAR}</div>
      <div class="lvl-row"><span>${esc(d.level_emoji)} ${esc(d.level_name)}</span><span>${rightLabel}</span></div>
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><div class="fill" id="fill"></div></div>
      <div class="next">${nextLabel}</div>
    </section>

    <section class="list" aria-label="Statistika">
      <div class="row"><div class="ico">${ICON_USERS}</div><div class="l">Taklif qilgan do'stlar</div><div class="v">${fmt(d.referrals)}</div></div>
      <div class="row"><div class="ico">${ICON_RANK}</div><div class="l">Reytingdagi o'rin</div><div class="v">#${fmt(d.rank)}</div></div>
      <div class="row"><div class="ico">${ICON_LEVEL}</div><div class="l">Daraja</div><div class="v">${esc(d.level_emoji)} ${esc(d.level_name)}</div></div>
    </section>`;

  countUp($('bal'), stars);
  requestAnimationFrame(() => requestAnimationFrame(() => { $('fill').style.width = pct + '%'; }));

  const uid = d.user_id || tg?.initDataUnsafe?.user?.id;
  refLink = `https://t.me/${BOT_USERNAME}?start=ref_${uid}`;
  $('bar').hidden = false;
}

async function loadProfile() {
  const userId = tg?.initDataUnsafe?.user?.id;
  if (!userId || !tg?.initData) {
    showError('Ilovani Telegram ichidagi bot orqali oching.');
    return;
  }
  skeleton();
  try {
    const res = await fetch(`${API_URL}/api/profile`, { headers: { 'X-Telegram-Init-Data': tg.initData } });
    const data = await res.json();
    if (data.error) { showError(data.error); return; }
    render(data);
  } catch (e) {
    showError('Internet aloqasini tekshirib, qayta urinib ko\'ring.');
  }
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.id);
  toast.id = setTimeout(() => t.classList.remove('on'), 1800);
}

$('refresh').onclick = () => { tap(); loadProfile(); };

$('share').onclick = () => {
  tap();
  if (!refLink) return;
  const text = "Star Rush botga qo'shiling va Stars yig'ing!";
  const url = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(text)}`;
  tg ? tg.openTelegramLink(url) : window.open(url);
};

$('copy').onclick = async () => {
  tap();
  if (!refLink) return;
  try {
    await navigator.clipboard.writeText(refLink);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = refLink; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  toast('Havola nusxalandi');
};

loadProfile();
</script>
</body>
</html>
